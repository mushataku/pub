<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>インベーダーゲーム</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier New",monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  canvas{background:#000;image-rendering:pixelated;max-width:100vw;max-height:88vh;border:2px solid #222}
  #hint{color:#888;font-size:14px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="672" height="768"></canvas>
  <div id="hint">← → で移動 ／ スペース・Z・↑・クリックで発射 ／ P 一時停止 ／ M 音ON/OFF</div>
</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---- 効果音（WebAudio・外部ファイル不要） ----
let actx = null, muted = false;
function beep(freq, dur, type='square', vol=0.08, slide=0){
  if(muted) return;
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  const o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), actx.currentTime+dur);
  v.gain.setValueAtTime(vol, actx.currentTime);
  v.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(v); v.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
const sfx = {
  shoot: ()=>beep(880,0.12,'square',0.05,-600),
  boom:  ()=>beep(160,0.3,'sawtooth',0.1,-120),
  hit:   ()=>beep(90,0.6,'sawtooth',0.15,-60),
  ufo:   ()=>beep(1200,0.25,'triangle',0.08,-800),
  step:  (i)=>beep([110,98,87,82][i%4],0.08,'square',0.06),
};

// ---- ドット絵 ----
const SPR = {
  squid:[["00011000","00111100","01111110","11011011","11111111","00100100","01011010","10100101"],
         ["00011000","00111100","01111110","11011011","11111111","01011010","10000001","01000010"]],
  crab: [["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"],
         ["00100000100","10010001001","10111111101","11101110111","11111111111","01111111110","00100000100","01000000010"]],
  octo: [["000011110000","011111111110","111111111111","111001100111","111111111111","000110011000","001101101100","110000000011"],
         ["000011110000","011111111110","111111111111","111001100111","111111111111","001110011100","011001100110","001100001100"]],
  ship: [["0000001000000","0000011100000","0000011100000","0111111111110","1111111111111","1111111111111","1111111111111","1111111111111"]],
  ufo:  [["0000011111100000","0001111111111000","0011111111111100","0110110110110110","1111111111111111","0011100110011100","0001000000001000"]],
};
function drawSpr(rows, x, y, s, color){
  g.fillStyle = color;
  for(let r=0;r<rows.length;r++) for(let c=0;c<rows[r].length;c++)
    if(rows[r][c]==='1') g.fillRect(x+c*s, y+r*s, s, s);
}

// ---- 状態 ----
const keys = {};
let state, player, aliens, pBullets, aBullets, shields, ufo, particles, score, hi = +(localStorageGet('inv_hi')||0);
let lives, level, dir, stepTimer, stepInterval, frame, animFrame, paused=false, stepCount=0, flash=0;

function localStorageGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function localStorageSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

function newGame(){ score=0; lives=3; level=1; startLevel(); state='play'; }
function startLevel(){
  player = {x:W/2-26, y:H-90, w:52, h:32, cool:0, dead:0};
  aliens = [];
  const types = ['squid','crab','crab','octo','octo'], pts={squid:30,crab:20,octo:10};
  const colors = {squid:'#ff4fd8',crab:'#4fd8ff',octo:'#7dff4f'};
  const top = 120 + Math.min(level-1,5)*20;
  for(let r=0;r<5;r++) for(let c=0;c<11;c++){
    const t = types[r];
    aliens.push({x:60+c*48, y:top+r*44, t, pts:pts[t], col:colors[t], alive:true});
  }
  pBullets=[]; aBullets=[]; particles=[]; ufo=null;
  dir=1; stepTimer=0; frame=0; animFrame=0;
  stepInterval = Math.max(8, 40 - (level-1)*4);
  shields=[];
  for(let i=0;i<4;i++){
    const bx = 80+i*150, by = H-200;
    const cells=[];
    for(let r=0;r<12;r++) for(let c=0;c<22;c++){
      if(r<3 && (c<3-r || c>18+r)) continue;          // 角を丸める
      if(r>8 && c>6 && c<15) continue;                 // 下の切り欠き
      cells.push({x:bx+c*4, y:by+r*4, ok:true});
    }
    shields.push(cells);
  }
}

function boom(x,y,col,n=18){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,col});
  }
}
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function hitShield(b){
  for(const s of shields) for(const c of s){
    if(c.ok && b.x<c.x+4 && b.x+b.w>c.x && b.y<c.y+4 && b.y+b.h>c.y){
      // 当たった周りを少し削る
      for(const d of s) if(d.ok && Math.abs(d.x-c.x)<=6 && Math.abs(d.y-c.y)<=6 && Math.random()<0.7) d.ok=false;
      c.ok=false; return true;
    }
  }
  return false;
}

// ---- 入力 ----
// 日本語入力ON・環境差でも撃てるように、スペース・Z・↑・Enter を全部「発射」に寄せる
function keyName(e){
  const k=e.key, c=e.code;
  if(c==='Space'||k===' '||k==='Spacebar'||e.keyCode===32||c==='KeyZ'||k==='z'||k==='Z'||c==='ArrowUp'||k==='ArrowUp'||c==='Enter'||k==='Enter') return 'Space';
  if(c==='ArrowLeft'||k==='ArrowLeft'||c==='KeyA') return 'ArrowLeft';
  if(c==='ArrowRight'||k==='ArrowRight'||c==='KeyD') return 'ArrowRight';
  return c;
}
function onKey(e,down){
  const n=keyName(e);
  if(['Space','ArrowLeft','ArrowRight','ArrowDown'].includes(n)) e.preventDefault();
  if(!down){ keys[n]=false; return; }
  keys[n]=true;
  if(e.repeat) return;
  if(n==='KeyM') muted=!muted;
  if(n==='KeyP' && state==='play') paused=!paused;
  if(n==='Space' && (state==='title'||state==='over')) newGame();
}
window.addEventListener('keydown',e=>onKey(e,true),true);
window.addEventListener('keyup',e=>onKey(e,false),true);
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
// マウスでも：クリックでスタート、押している間は発射
cv.addEventListener('mousedown',()=>{ window.focus(); if(state==='title'||state==='over'){newGame();return;} keys.Space=true; });
addEventListener('mouseup',()=>{ keys.Space=false; });
window.focus();
// タッチ（スマホでも遊べるように）
cv.addEventListener('touchstart',e=>{ e.preventDefault(); if(state!=='play'){newGame();return;} touchMove(e); keys.Space=true; },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); touchMove(e); },{passive:false});
cv.addEventListener('touchend',()=>{ keys.ArrowLeft=keys.ArrowRight=keys.Space=false; });
function touchMove(e){
  const r=cv.getBoundingClientRect(), tx=(e.touches[0].clientX-r.left)*W/r.width;
  keys.ArrowLeft = tx < player.x+player.w/2-10; keys.ArrowRight = tx > player.x+player.w/2+10;
}

// ---- 更新 ----
function update(){
  if(state!=='play' || paused) return;
  frame++;
  if(flash>0) flash--;

  // プレイヤー
  if(player.dead>0){ player.dead--; if(player.dead===0){ if(lives<=0){ gameOver(); return; } player.x=W/2-26; aBullets=[]; } }
  else{
    if(keys.ArrowLeft)  player.x=Math.max(10,player.x-5);
    if(keys.ArrowRight) player.x=Math.min(W-player.w-10,player.x+5);
    if(player.cool>0) player.cool--;
    if(keys.Space && player.cool===0 && pBullets.length<2){
      pBullets.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:14}); player.cool=14; sfx.shoot();
    }
  }

  // インベーダーの行進（数が減るほど速くなる）
  const live = aliens.filter(a=>a.alive);
  const interval = Math.max(2, Math.floor(stepInterval * (live.length/55)) );
  if(++stepTimer>=interval){
    stepTimer=0; animFrame^=1; sfx.step(stepCount++);
    let minX=Infinity,maxX=-Infinity;
    for(const a of live){ minX=Math.min(minX,a.x); maxX=Math.max(maxX,a.x+44); }
    if((dir>0 && maxX+12>W-10) || (dir<0 && minX-12<10)){ dir*=-1; for(const a of live) a.y+=20; }
    else for(const a of live) a.x+=12*dir;
  }

  // 敵の弾（プレイヤーの真上にいる列を優先して撃つ）
  const fireRate = 0.012 + level*0.004;
  if(live.length && Math.random()<fireRate*Math.min(3,1+(55-live.length)/20) && aBullets.length<3+level){
    const cols={};
    for(const a of live){ const k=Math.round(a.x/48); if(!cols[k]||a.y>cols[k].y) cols[k]=a; }
    const shooters=Object.values(cols);
    let s = shooters[Math.floor(Math.random()*shooters.length)];
    if(Math.random()<0.4){ s = shooters.reduce((b,a)=>Math.abs(a.x-player.x)<Math.abs(b.x-player.x)?a:b); }
    aBullets.push({x:s.x+20,y:s.y+30,w:4,h:14,vy:4+level*0.4});
  }

  // UFO
  if(!ufo && frame%900===600){ const fromL=Math.random()<.5; ufo={x:fromL?-64:W,y:70,w:64,h:28,vx:fromL?2.5:-2.5}; sfx.ufo(); }
  if(ufo){ ufo.x+=ufo.vx; if(frame%20===0) sfx.ufo(); if(ufo.x<-80||ufo.x>W+20) ufo=null; }

  // 自分の弾
  for(const b of pBullets){
    b.y-=11;
    if(hitShield(b)){ b.dead=true; continue; }
    for(const a of live){
      if(a.alive && rectHit(b,{x:a.x,y:a.y,w:44,h:32})){
        a.alive=false; b.dead=true; score+=a.pts; boom(a.x+22,a.y+16,a.col); sfx.boom(); break;
      }
    }
    if(!b.dead && ufo && rectHit(b,ufo)){
      const p=[50,100,150,300][Math.floor(Math.random()*4)];
      score+=p; boom(ufo.x+32,ufo.y+14,'#ff3b3b',40); particles.push({text:p+'',x:ufo.x+20,y:ufo.y,life:60,col:'#ff3b3b',vx:0,vy:-0.5});
      ufo=null; b.dead=true; sfx.boom();
    }
    if(b.y<40) b.dead=true;
  }
  pBullets=pBullets.filter(b=>!b.dead);

  // 敵の弾
  for(const b of aBullets){
    b.y+=b.vy;
    if(hitShield(b)){ b.dead=true; continue; }
    if(player.dead===0 && rectHit(b,player)){
      b.dead=true; lives--; player.dead=90; flash=12; boom(player.x+26,player.y+16,'#fff',50); sfx.hit();
    }
    if(b.y>H) b.dead=true;
  }
  aBullets=aBullets.filter(b=>!b.dead);

  // インベーダーがシールドを踏み潰す・下まで来たら負け
  for(const a of live){
    for(const s of shields) for(const c of s) if(c.ok && rectHit({x:a.x,y:a.y,w:44,h:32},{x:c.x,y:c.y,w:4,h:4})) c.ok=false;
    if(a.y+32>=player.y){ lives=0; player.dead=1; }
  }

  // パーティクル
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+= p.text?0:0.08; p.life--; }
  particles=particles.filter(p=>p.life>0);

  if(score>hi){ hi=score; localStorageSet('inv_hi',hi); }
  if(live.length===0){ level++; state='clear'; setTimeout(()=>{ startLevel(); state='play'; },1800); }
}
function gameOver(){ state='over'; }

// ---- 描画 ----
function txt(s,x,y,size=24,col='#fff',align='center'){ g.fillStyle=col; g.font=`bold ${size}px "Courier New",monospace`; g.textAlign=align; g.fillText(s,x,y); }

let stars = Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2,v:Math.random()*0.4+0.1}));
function draw(){
  g.fillStyle = flash>0 && flash%4<2 ? '#400' : '#000'; g.fillRect(0,0,W,H);
  for(const s of stars){ s.y+=s.v; if(s.y>H){s.y=0;s.x=Math.random()*W;} g.fillStyle='#555'; g.fillRect(s.x,s.y,s.s,s.s); }

  txt('SCORE '+String(score).padStart(5,'0'),20,36,22,'#fff','left');
  txt('HI '+String(hi).padStart(5,'0'),W/2,36,22,'#ffd84f');
  txt('LV '+level,W-20,36,22,'#7dff4f','right');

  if(state==='title'){
    txt('SPACE INVADERS',W/2,220,52,'#7dff4f');
    drawSpr(SPR.ufo[0],W/2-140,300,3,'#ff3b3b');    txt('= ???',W/2+40,320,22,'#fff','left');
    drawSpr(SPR.squid[0],W/2-128,360,3,'#ff4fd8');  txt('= 30 点',W/2+40,382,22,'#fff','left');
    drawSpr(SPR.crab[0],W/2-134,420,3,'#4fd8ff');   txt('= 20 点',W/2+40,442,22,'#fff','left');
    drawSpr(SPR.octo[0],W/2-136,480,3,'#7dff4f');   txt('= 10 点',W/2+40,502,22,'#fff','left');
    if(Math.floor(Date.now()/500)%2) txt('スペース か クリックでスタート',W/2,620,26,'#ffd84f');
    return;
  }

  // シールド
  g.fillStyle='#3cff6e';
  for(const s of shields) for(const c of s) if(c.ok) g.fillRect(c.x,c.y,4,4);
  // インベーダー
  for(const a of aliens) if(a.alive){
    const sp=SPR[a.t][animFrame], w=sp[0].length*4;
    drawSpr(sp,a.x+(44-w)/2,a.y,4,a.col);
  }
  if(ufo) drawSpr(SPR.ufo[0],ufo.x,ufo.y,4,'#ff3b3b');
  // プレイヤー
  if(player.dead===0 || (player.dead%10<5 && lives>0)) drawSpr(SPR.ship[0],player.x,player.y,4,'#3cff6e');
  // 弾
  g.fillStyle='#fff'; for(const b of pBullets) g.fillRect(b.x,b.y,b.w,b.h);
  g.fillStyle='#ffd84f';
  for(const b of aBullets){ const z=Math.floor(b.y/6)%2; g.fillRect(b.x+(z?-2:2),b.y,4,4); g.fillRect(b.x,b.y+5,4,4); g.fillRect(b.x+(z?2:-2),b.y+10,4,4); }
  // パーティクル
  for(const p of particles){
    if(p.text){ txt(p.text,p.x,p.y,20,p.col,'left'); continue; }
    g.globalAlpha=Math.max(0,p.life/50); g.fillStyle=p.col; g.fillRect(p.x,p.y,3,3); g.globalAlpha=1;
  }
  // 地面と残機
  g.fillStyle='#3cff6e'; g.fillRect(0,H-40,W,2);
  for(let i=0;i<lives;i++) drawSpr(SPR.ship[0],20+i*60,H-30,3,'#3cff6e');
  if(muted) txt('音OFF',W-20,H-12,16,'#888','right');

  if(paused) txt('PAUSE',W/2,H/2,48,'#ffd84f');
  if(state==='clear') txt('STAGE CLEAR!',W/2,H/2,48,'#7dff4f');
  if(state==='over'){
    g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(0,H/2-110,W,200);
    txt('GAME OVER',W/2,H/2-30,56,'#ff3b3b');
    txt('SCORE '+score,W/2,H/2+20,28,'#fff');
    if(Math.floor(Date.now()/500)%2) txt('スペース か クリックでもう一回',W/2,H/2+70,24,'#ffd84f');
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
state='title'; startLevel(); loop();
</script>
</body>
</html>
