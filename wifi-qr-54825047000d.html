<div id=big role=dialog aria-modal=true><h2 id=bt></h2><div id=bq></div><p id=bs></p><p>押すか Esc で戻る</p></div>
<script>
const big=document.getElementById('big');
function show(c){document.getElementById('bt').textContent=c.dataset.place;document.getElementById('bs').textContent=c.dataset.ssid;
 document.getElementById('bq').innerHTML=c.querySelector('.q').innerHTML;big.classList.add('on');}
function hide(){big.classList.remove('on');document.getElementById('bq').innerHTML='';}
document.querySelectorAll('.c').forEach(c=>{c.addEventListener('click',()=>show(c));
 c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(c);}});});
big.addEventListener('click',hide);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();});
</script></html>
