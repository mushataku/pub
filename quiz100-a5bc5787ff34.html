<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>頻出クイズ100</title>
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1d1b18;--sub:#6b665e;--line:#e4dfd5;
  --accent:#e8590c;--accent2:#1c7ed6;--ok:#2f9e44;--ng:#e03131;--okbg:#ebfbee;--ngbg:#fff5f5;
  --shadow:0 2px 10px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16161a;--card:#202027;--ink:#f1efe9;--sub:#a29d94;--line:#34343d;
  --accent:#ff922b;--accent2:#4dabf7;--ok:#51cf66;--ng:#ff6b6b;--okbg:#1d3324;--ngbg:#3a1f22;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#16161a;--card:#202027;--ink:#f1efe9;--sub:#a29d94;--line:#34343d;
  --accent:#ff922b;--accent2:#4dabf7;--ok:#51cf66;--ng:#ff6b6b;--okbg:#1d3324;--ngbg:#3a1f22;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;text-align:left;transition:transform .08s,background .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center}
.btn.ghost{background:transparent;text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub);margin-bottom:8px}
.hud b{color:var(--ink);font-size:18px}
.combo{color:var(--accent);font-weight:800}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--accent));transform-origin:left;transition:transform .1s linear}
.cat{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.q{font-size:20px;font-weight:700;margin:10px 0 16px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:10px;align-items:center}
.choice .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--sub)}
.choice.ok{background:var(--okbg);border-color:var(--ok)}
.choice.ng{background:var(--ngbg);border-color:var(--ng)}
.choice[disabled]{cursor:default}
.fb{margin-top:14px;min-height:28px;font-weight:700;text-align:center}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.mark-ok{color:var(--ok);font-weight:800}.mark-ng{color:var(--ng);font-weight:800}
.catbar{display:grid;grid-template-columns:80px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.catbar .t{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.catbar .t i{display:block;height:100%;background:var(--accent2)}
.hide{display:none}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
<header>
  <h1>頻出クイズ<span>100</span></h1>
  <button class="themebtn" id="themeBtn" aria-label="テーマ切替">◐</button>
</header>

<!-- ホーム -->
<section id="home">
  <div class="card">
    <div class="small">ジャンルを選ぶ（複数可・未選択＝全部）</div>
    <div class="chips" id="cats"></div>
    <div class="row">
      <button class="btn primary" data-n="10">10問チャレンジ</button>
      <button class="btn primary" data-n="20">20問チャレンジ</button>
    </div>
    <div style="height:10px"></div>
    <div class="row">
      <button class="btn ghost" id="weakBtn">苦手だけ復習</button>
      <button class="btn ghost" data-n="100">全問マラソン</button>
    </div>
    <p class="small" style="margin:12px 0 0">1問15秒。早く正解するほど高得点。連続正解でコンボボーナス。キーボードの 1〜4 でも答えられます。</p>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>これまでの記録</b>
      <span class="small" id="poolInfo"></span>
    </div>
    <div class="stats" id="lifeStats"></div>
    <div id="catStats"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="csvBtn">記録をCSVで保存</button>
      <button class="btn ghost" id="resetBtn">記録を消す</button>
    </div>
  </div>
</section>

<!-- 出題 -->
<section id="play" class="hide">
  <div class="card" id="qcard">
    <div class="hud">
      <span>第 <b id="qi">1</b> / <span id="qn">10</span> 問</span>
      <span class="combo" id="combo"></span>
      <span>スコア <b id="score">0</b></span>
    </div>
    <div class="bar"><i id="timebar"></i></div>
    <span class="cat" id="qcat"></span>
    <div class="q" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb"></div>
    <button class="btn primary hide" id="nextBtn" style="margin-top:8px">次へ（Enter）</button>
  </div>
  <button class="btn ghost" id="quitBtn">やめてホームへ</button>
</section>

<!-- 結果 -->
<section id="result" class="hide">
  <div class="card">
    <div class="small" style="text-align:center">今回のスコア</div>
    <div class="big" id="rScore">0</div>
    <div style="text-align:center;font-weight:700" id="rRank"></div>
    <div class="stats" id="rStats"></div>
    <table><thead><tr><th></th><th>問題</th><th class="r">時間</th></tr></thead><tbody id="rTable"></tbody></table>
  </div>
  <div class="row">
    <button class="btn primary" id="againBtn">もう一回</button>
    <button class="btn ghost" id="homeBtn">ホームへ</button>
  </div>
</section>
</div>

// ---- 汎用 ----
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ["home","play","result"].forEach(s => $("#"+s).classList.toggle("hide", s!==id)); window.scrollTo(0,0); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }

// ---- ホーム ----
function renderHome(){
  $("#cats").innerHTML = CATS.map(c => `<button class="chip ${selCats.has(c)?"on":""}" data-c="${c}">${c}（${POOL.filter(q=>q[0]===c).length}）</button>`).join("");
  $("#poolInfo").textContent = `問題数 ${POOL.length}`;
  const A = REC.answers, ok = A.filter(a=>a.ok).length;
  const avg = A.length ? (A.reduce((s,a)=>s+a.t,0)/A.length).toFixed(1) : "-";
  const best = REC.games.length ? Math.max(...REC.games.map(g=>g.score)) : 0;
  $("#lifeStats").innerHTML = `<div><b>${A.length}</b><span class="small">回答数</span></div><div><b>${pct(ok,A.length)}%</b><span class="small">正答率</span></div><div><b>${avg}s</b><span class="small">平均回答時間</span></div>`;
  $("#catStats").innerHTML = (A.length ? CATS.map(c => {
    const x = A.filter(a=>POOL[a.id][0]===c), o = x.filter(a=>a.ok).length;
    return `<div class="catbar"><span>${c}</span><span class="t"><i style="width:${pct(o,x.length)}%"></i></span><span class="small" style="text-align:right">${x.length?pct(o,x.length)+"%":"未挑戦"}</span></div>`;
  }).join("") : `<p class="small">まだ記録がありません。まずは10問チャレンジ！</p>`) + (best ? `<p class="small">ハイスコア: <b>${best}</b>（${REC.games.length}回プレイ）</p>` : "");
  $("#weakBtn").textContent = `苦手だけ復習（${weakIds().length}問）`;
}
function weakIds(){
  // 最後の回答が不正解 or 正答率50%未満の問題
  const by = {};
  REC.answers.forEach(a => { (by[a.id] ||= []).push(a); });
  return Object.entries(by).filter(([id,xs]) => !xs[xs.length-1].ok || pct(xs.filter(x=>x.ok).length,xs.length) < 50).map(([id]) => +id);
}
$("#cats").addEventListener("click", e => {
  const c = e.target.dataset.c; if(!c) return;
  selCats.has(c) ? selCats.delete(c) : selCats.add(c); renderHome();
});
document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => {
  let ids = POOL.map((_,i)=>i).filter(i => !selCats.size || selCats.has(POOL[i][0]));
  start(shuffle(ids).slice(0, +b.dataset.n), b.dataset.n === "100" ? "全問マラソン" : `${b.dataset.n}問チャレンジ`);
}));
$("#weakBtn").addEventListener("click", () => {
  const w = weakIds(); if(!w.length){ $("#weakBtn").textContent = "苦手はまだありません！"; return; }
  start(shuffle(w).slice(0,20), "苦手復習");
});
$("#resetBtn").addEventListener("click", () => {
  const b = $("#resetBtn");
  if(b.dataset.arm){ REC={answers:[],games:[]}; saveRec(REC); delete b.dataset.arm; b.textContent="記録を消す"; renderHome(); }
  else { b.dataset.arm="1"; b.textContent="本当に消す？もう一度押す"; setTimeout(()=>{delete b.dataset.arm; b.textContent="記録を消す";},3000); }
});
$("#csvBtn").addEventListener("click", () => {
  const rows = [["日時","ジャンル","問題","正解","選んだ答え","正誤","回答秒"]].concat(
    REC.answers.map(a => [new Date(a.at).toLocaleString("ja-JP"), POOL[a.id][0], POOL[a.id][1], POOL[a.id][2], a.pick ?? "(時間切れ)", a.ok?"○":"×", a.t]));
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  const a = Object.assign(document.createElement("a"), {href:url, download:"quiz_records.csv"}); a.click(); URL.revokeObjectURL(url);
});

// ---- ゲーム ----
function start(ids, label){
  if(!ids.length) return;
  game = {ids, label, i:0, score:0, combo:0, maxCombo:0, log:[], locked:false};
  $("#qn").textContent = ids.length; show("play"); ask();
}
function ask(){
  const id = game.ids[game.i], q = POOL[id];
  game.opts = shuffle(q.slice(2)); game.t0 = performance.now(); game.locked = false;
  $("#qi").textContent = game.i+1; $("#score").textContent = game.score;
  $("#combo").textContent = game.combo >= 2 ? `🔥 ${game.combo}コンボ` : "";
  $("#qcat").textContent = q[0]; $("#qtext").textContent = q[1];
  $("#fb").textContent = ""; $("#fb").className = "fb"; $("#nextBtn").classList.add("hide");
  $("#choices").innerHTML = game.opts.map((o,k) => `<button class="btn choice" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join("");
  clearInterval(timerId);
  timerId = setInterval(() => {
    const el = (performance.now()-game.t0)/1000;
    $("#timebar").style.transform = `scaleX(${Math.max(0,1-el/LIMIT)})`;
    if(el >= LIMIT) answer(null);
  }, 50);
}
function answer(k){
  if(game.locked) return; game.locked = true; clearInterval(timerId);
  const id = game.ids[game.i], q = POOL[id];
  const t = Math.min(LIMIT, (performance.now()-game.t0)/1000);
  const pick = k === null ? null : game.opts[k], ok = pick === q[2];
  let gain = 0;
  if(ok){ game.combo++; game.maxCombo = Math.max(game.maxCombo, game.combo);
    gain = 100 + Math.round((LIMIT-t)/LIMIT*100) + (game.combo>=3 ? 20*(game.combo-2) : 0);
    game.score += gain;
  } else game.combo = 0;
  game.log.push({id, ok, t:+t.toFixed(1), pick});
  REC.answers.push({id, ok, t:+t.toFixed(1), pick, at:Date.now()}); saveRec(REC);
  document.querySelectorAll(".choice").forEach((b,i) => {
    b.disabled = true;
    if(game.opts[i] === q[2]) b.classList.add("ok");
    else if(i === k) b.classList.add("ng");
  });
  const fb = $("#fb");
  if(ok){ fb.className="fb ok"; fb.textContent = `正解！ +${gain}点（${t.toFixed(1)}秒）`; $("#qcard").classList.remove("pop"); void $("#qcard").offsetWidth; $("#qcard").classList.add("pop"); if(game.combo>=3) burst(40); }
  else { fb.className="fb ng"; fb.textContent = (k===null ? "時間切れ… " : "残念… ") + `正解は「${q[2]}」`; $("#qcard").classList.remove("shake"); void $("#qcard").offsetWidth; $("#qcard").classList.add("shake"); }
  $("#score").textContent = game.score;
  $("#combo").textContent = game.combo >= 2 ? `🔥 ${game.combo}コンボ` : "";
  $("#nextBtn").textContent = game.i+1 < game.ids.length ? "次へ（Enter）" : "結果を見る（Enter）";
  $("#nextBtn").classList.remove("hide"); $("#nextBtn").focus();
}
function next(){ game.i++; game.i < game.ids.length ? ask() : finish(); }
$("#choices").addEventListener("click", e => { const b = e.target.closest(".choice"); if(b && !b.disabled) answer(+b.dataset.k); });
$("#nextBtn").addEventListener("click", next);
$("#quitBtn").addEventListener("click", () => { clearInterval(timerId); game=null; renderHome(); show("home"); });
document.addEventListener("keydown", e => {
  if($("#play").classList.contains("hide") || !game) return;
  if(!game.locked && ["1","2","3","4"].includes(e.key)) answer(+e.key-1);
  else if(game.locked && e.key === "Enter"){ e.preventDefault(); next(); }
});

function finish(){
  const L = game.log, ok = L.filter(x=>x.ok).length, n = L.length;
  const avg = (L.reduce((s,x)=>s+x.t,0)/n).toFixed(1);
  const okT = L.filter(x=>x.ok).map(x=>x.t), fast = okT.length ? Math.min(...okT).toFixed(1)+"s" : "-";
  const prevBest = REC.games.length ? Math.max(...REC.games.map(g=>g.score)) : 0;
  REC.games.push({at:Date.now(), label:game.label, score:game.score, ok, n, avg:+avg}); saveRec(REC);
  const r = pct(ok,n);
  $("#rScore").textContent = game.score;
  $("#rRank").textContent = (game.score > prevBest && prevBest ? "🎉 ハイスコア更新！ " : "") +
    (r===100 ? "パーフェクト！クイズ王" : r>=80 ? "すごい！上級者" : r>=60 ? "なかなかの物知り" : r>=40 ? "あと一歩！" : "伸びしろしかない！");
  $("#rStats").innerHTML = `<div><b>${ok}/${n}</b><span class="small">正解</span></div><div><b>${avg}s</b><span class="small">平均時間</span></div><div><b>${game.maxCombo}</b><span class="small">最大コンボ</span></div>`;
  $("#rTable").innerHTML = L.map(x => `<tr><td class="${x.ok?"mark-ok":"mark-ng"}">${x.ok?"○":"×"}</td><td>${esc(POOL[x.id][1])}<br><span class="small">正解: ${esc(POOL[x.id][2])}${x.ok?"":" ／ あなた: "+esc(x.pick ?? "時間切れ")}</span></td><td class="r">${x.t}s</td></tr>`).join("") +
    `<tr><td></td><td class="small">最速正解</td><td class="r">${fast}</td></tr>`;
  show("result"); if(r>=80) burst(120);
}
$("#againBtn").addEventListener("click", () => start(shuffle(game.ids), game.label));
$("#homeBtn").addEventListener("click", () => { renderHome(); show("home"); });

// ---- 紙吹雪 ----
const cv = $("#confetti"), cx = cv.getContext("2d"); let parts = [], raf = null;
function burst(n){
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#e8590c","#1c7ed6","#2f9e44","#f59f00","#d6336c"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*12, vy:Math.random()*-10-2, r:Math.random()*6+3, c:cols[i%5], life:90});
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.life--; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,p.r,p.r*.6); });
  parts = parts.filter(p => p.life>0 && p.y<cv.height+20);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

// ---- テーマ ----
$("#themeBtn").addEventListener("click", () => {
  const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  d.dataset.theme = dark ? "light" : "dark";
});

renderHome();
</script>
</body>
</html>
