<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>かんたん家計簿</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--sub:#667085;--line:#e4e7ec;--acc:#2f6fed;--in:#12a150;--out:#e5484d;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e8ebf0;--sub:#98a2b3;--line:#2b3240;--acc:#6b9bff;--in:#3ccf7a;--out:#ff6b6f;--chip:#232b3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.note{font-size:.8rem;color:var(--sub);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 12px;font-size:1rem;cursor:pointer}
.month b{font-size:1.1rem}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum small{display:block;color:var(--sub);font-size:.75rem}
.sum span{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px;border-radius:10px;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font-size:.8rem;color:var(--sub);margin:8px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips button.plus{background:none;border-style:dashed;color:var(--acc)}
.chips .x{margin-left:6px;opacity:.7}
.newcat{display:grid;grid-template-columns:64px 1fr auto;gap:6px;margin-top:8px}
.newcat[hidden]{display:none}
.newcat select{padding:8px 4px;font-size:1.1rem}
.newcat button{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:0 14px;font-size:.95rem;cursor:pointer}
.add{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
h2{font-size:1rem;margin:0 0 10px}
.bar{margin-bottom:8px}
.bar .lab{display:flex;justify-content:space-between;font-size:.85rem}
.bar .track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;background:var(--out);border-radius:6px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.ico{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
.mid{flex:1;min-width:0}
.mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--sub);font-size:.75rem}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:0;background:none;color:var(--sub);font-size:1.1rem;cursor:pointer;padding:4px}
.empty{color:var(--sub);text-align:center;padding:12px 0;font-size:.9rem}
.tip{background:var(--chip);border-radius:10px;padding:10px;font-size:.9rem}

h1,h2,h3{word-break:auto-phrase}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 かんたん家計簿</h1>
  <p class="note">見本で動く体験版です。入力はこの端末の中だけに保存されます。</p>

  <div class="card">
    <div class="month">
      <button id="prev" aria-label="前の月">‹</button>
      <b id="mlabel"></b>
      <button id="next" aria-label="次の月">›</button>
    </div>
    <div class="sum">
      <div><small>収入</small><span class="in" id="sIn">0</span></div>
      <div><small>支出</small><span class="out" id="sOut">0</span></div>
      <div><small>残り</small><span id="sBal">0</span></div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tOut" class="on">支出</button>
      <button id="tIn">収入</button>
    </div>
    <label>カテゴリ</label>
    <div class="chips" id="cats"></div>
    <div id="newCat" class="newcat" hidden>
      <select id="ncIcon" aria-label="アイコン"></select>
      <input id="ncName" maxlength="12" placeholder="新しいカテゴリ名（例: ペット）">
      <button id="ncAdd" type="button">追加</button>
    </div>
    <div class="row">
      <div><label for="amt">金額（円）</label><input id="amt" type="number" inputmode="numeric" min="0" placeholder="例: 1200"></div>
      <div><label for="date">日付</label><input id="date" type="date"></div>
    </div>
    <label for="memo">メモ（任意）</label>
    <input id="memo" placeholder="例: スーパーで食材">
    <button class="add" id="add">＋ 記録する</button>
  </div>

  <div class="card">
    <h2>今月ひとこと</h2>
    <div class="tip" id="tip"></div>
  </div>

  <div class="card">
    <h2>支出の内訳</h2>
    <div id="bars"></div>
  </div>

  <div class="card">
    <h2>記録の一覧</h2>
    <ul id="list"></ul>
  </div>
</div>
<script>
const CATS={
  out:[["食費","🍙"],["日用品","🧻"],["交通","🚃"],["タクシー経費","🚕"],["住まい","🏠"],["水道光熱","💡"],["通信","📱"],["趣味・交際","🎉"],["医療","💊"],["その他","📦"]],
  in:[["給料","💼"],["副業","🧑‍💻"],["お小遣い","🎁"],["その他","📦"]]
};
const KEY="kakeibo-demo-v2";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"null")||null}catch(e){data=null}
const today=new Date();
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
if(!data){ // 見本データ
  const y=today.getFullYear(),m=pad(today.getMonth()+1);
  data=[
    {t:"in",c:"給料",a:220000,d:`${y}-${m}-01`,m:"今月分"},
    {t:"out",c:"住まい",a:65000,d:`${y}-${m}-01`,m:"家賃"},
    {t:"out",c:"食費",a:3280,d:`${y}-${m}-03`,m:"スーパー"},
    {t:"out",c:"通信",a:4980,d:`${y}-${m}-05`,m:"スマホ代"},
    {t:"out",c:"趣味・交際",a:6000,d:`${y}-${m}-08`,m:"友だちとごはん"},
    {t:"out",c:"交通",a:1500,d:`${y}-${m}-10`,m:"ICカードチャージ"},
    {t:"out",c:"食費",a:980,d:`${y}-${m}-12`,m:"コンビニ"},
    {t:"out",c:"タクシー経費",a:2340,d:`${y}-${m}-14`,m:"駅→取引先"}
  ].map((x,i)=>({...x,id:Date.now()+i}));
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
let type="out",cat=CATS.out[0][0],view=new Date(today.getFullYear(),today.getMonth(),1);
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
let custom={out:[],in:[]};
try{custom=JSON.parse(localStorage.getItem(KEY+"-cats")||"null")||custom}catch(e){}
const saveCats=()=>{try{localStorage.setItem(KEY+"-cats",JSON.stringify(custom))}catch(e){}};
const allCats=t=>CATS[t].concat(custom[t]||[]);
const icon=(t,c)=>(allCats(t).find(x=>x[0]===c)||["","📦"])[1];
$("date").value=ymd(today);
["🏷️","🐶","👶","📚","💄","👕","🎮","☕","🍺","🏋️","✈️","🚗","🎁","💳","🏥","🌱"].forEach(e=>{const o=document.createElement("option");o.textContent=e;$("ncIcon").appendChild(o)});

function drawCats(){
  $("cats").innerHTML="";
  allCats(type).forEach(([n,i])=>{
    const b=document.createElement("button");
    b.textContent=i+" "+n; if(n===cat)b.className="on";
    b.onclick=()=>{cat=n;drawCats()};
    if((custom[type]||[]).some(x=>x[0]===n)){
      const x=document.createElement("span");x.className="x";x.textContent="✕";x.title="このカテゴリを消す";
      x.onclick=e=>{e.stopPropagation();custom[type]=custom[type].filter(y=>y[0]!==n);saveCats();if(cat===n)cat=CATS[type][0][0];drawCats()};
      b.appendChild(x);
    }
    $("cats").appendChild(b);
  });
  const p=document.createElement("button");p.className="plus";p.textContent="＋ カテゴリを追加";
  p.onclick=()=>{$("newCat").hidden=!$("newCat").hidden;if(!$("newCat").hidden)$("ncName").focus()};
  $("cats").appendChild(p);
}
function addCat(){
  const n=$("ncName").value.trim();
  if(!n){$("ncName").focus();return}
  if(!allCats(type).some(x=>x[0]===n)){(custom[type]=custom[type]||[]).push([n,$("ncIcon").value]);saveCats()}
  cat=n;$("ncName").value="";$("newCat").hidden=true;drawCats();
}
$("ncAdd").onclick=addCat;
$("ncName").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addCat()}});
function setType(t){type=t;cat=CATS[t][0][0];$("tOut").className=t==="out"?"on":"";$("tIn").className=t==="in"?"on":"";drawCats()}
$("tOut").onclick=()=>setType("out");
$("tIn").onclick=()=>setType("in");
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("add").onclick=()=>{
  const a=Number($("amt").value);
  if(!a||a<=0){$("amt").focus();$("amt").style.borderColor="var(--out)";return}
  $("amt").style.borderColor="";
  const d=$("date").value||ymd(today);
  data.push({id:Date.now(),t:type,c:cat,a,d,m:$("memo").value.trim()});
  save();$("amt").value="";$("memo").value="";
  const dd=new Date(d);view=new Date(dd.getFullYear(),dd.getMonth(),1);render();
};
$("amt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("add").click()}});

function render(){
  const key=view.getFullYear()+"-"+pad(view.getMonth()+1);
  $("mlabel").textContent=view.getFullYear()+"年"+(view.getMonth()+1)+"月";
  const rows=data.filter(x=>x.d.startsWith(key)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const sIn=rows.filter(x=>x.t==="in").reduce((s,x)=>s+x.a,0);
  const sOut=rows.filter(x=>x.t==="out").reduce((s,x)=>s+x.a,0);
  $("sIn").textContent=yen(sIn);$("sOut").textContent=yen(sOut);
  $("sBal").textContent=yen(sIn-sOut);$("sBal").className=sIn-sOut<0?"out":"";
  // 内訳
  const by={};rows.filter(x=>x.t==="out").forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const max=ent.length?ent[0][1]:1;
  $("bars").innerHTML=ent.length?ent.map(([c,v])=>`<div class="bar"><div class="lab"><span>${icon("out",c)} ${c}</span><span>${yen(v)}（${Math.round(v/sOut*100)}%）</span></div><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div></div>`).join(""):'<div class="empty">まだ支出がありません</div>';
  // ひとこと
  let tip;
  if(!rows.length)tip="この月はまだ記録がありません。まずは1件入れてみましょう。";
  else if(sIn&&sOut/sIn<0.7)tip=`収入の${Math.round(sOut/sIn*100)}%で収まっています。この調子だと月に約${yen(sIn-sOut)}残せそうです 👍`;
  else if(ent.length)tip=`いちばん多いのは「${ent[0][0]}」で${yen(ent[0][1])}。ここを1割減らすと${yen(ent[0][1]*0.1)}浮きます。`;
  else tip="収入が記録されています。支出も入れると内訳が見えます。";
  $("tip").textContent=tip;
  // 一覧
  $("list").innerHTML=rows.length?"":'<li class="empty" style="justify-content:center">記録がありません</li>';
  rows.forEach(x=>{
    const li=document.createElement("li");
    const dt=new Date(x.d);
    li.innerHTML=`<div class="ico">${icon(x.t,x.c)}</div><div class="mid"><div>${x.c}${x.m?"・"+x.m.replace(/[<>&]/g,""):""}</div><small>${dt.getMonth()+1}月${dt.getDate()}日</small></div><div class="amt ${x.t}">${x.t==="in"?"+":"−"}${yen(x.a)}</div>`;
    const b=document.createElement("button");b.className="del";b.textContent="✕";b.setAttribute("aria-label","削除");
    b.onclick=()=>{data=data.filter(y=>y.id!==x.id);save();render()};
    li.appendChild(b);$("list").appendChild(li);
  });
}
drawCats();render();
</script>
</body>
</html>
